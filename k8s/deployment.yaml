apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticcloud
  namespace: elasticcloud
  labels:
    app.kubernetes.io/name: elasticcloud
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticcloud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticcloud
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: control-plane
          image: elasticcloud:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-ws
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: elasticcloud-config
          volumeMounts:
            - name: data-volume
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: elasticcloud-data-pvc
