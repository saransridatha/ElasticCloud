apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticcloud-data-pvc
  namespace: elasticcloud
  labels:
    app.kubernetes.io/name: elasticcloud
    app.kubernetes.io/component: database-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: gp3 # Uncomment for AWS EKS EBS CSI driver
