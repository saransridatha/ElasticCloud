apiVersion: v1
kind: Service
metadata:
  name: elasticcloud-service
  namespace: elasticcloud
  labels:
    app.kubernetes.io/name: elasticcloud
    app.kubernetes.io/component: control-plane
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: elasticcloud
